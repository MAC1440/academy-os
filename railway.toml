[build]
builder = "RAILPACK"
buildCommand = "npm run prisma:generate --workspace=api && npm run build --workspace=api"
watchPatterns = ["/apps/api/**", "/packages/**", "/package.json", "/package-lock.json"]

[deploy]
preDeployCommand = ["npm run prisma:migrate:deploy --workspace=api"]
startCommand = "npm run start:prod --workspace=api"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
